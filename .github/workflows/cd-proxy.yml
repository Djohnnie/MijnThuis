name: CD - Proxy

on:
  push:
    branches:
      - master
    paths:
      - 'MijnThuis.ModbusProxy.Api/**'
      - '.github/workflows/cd-proxy.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore NuGet packages
        run: dotnet restore MijnThuis.ModbusProxy.Api/MijnThuis.ModbusProxy.Api.csproj

      - name: Publish
        run: dotnet publish MijnThuis.ModbusProxy.Api/MijnThuis.ModbusProxy.Api.csproj --configuration Release --output MijnThuis.ModbusProxy.Api/bin/Release/publish

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        working-directory: MijnThuis.ModbusProxy.Api
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.PROXY_IMAGE_NAME }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.PROXY_IMAGE_NAME }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to remote server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo /usr/local/bin/docker ps -q --filter "name=${{ secrets.PROXY_CONTAINER_NAME }}" | grep -q . && sudo /usr/local/bin/docker stop ${{ secrets.PROXY_CONTAINER_NAME }}

            sudo /usr/local/bin/docker ps -a -q --filter "name=${{ secrets.PROXY_CONTAINER_NAME }}" | grep -q . && sudo /usr/local/bin/docker rm ${{ secrets.PROXY_CONTAINER_NAME }}

            sudo /usr/local/bin/docker images -q ${{ secrets.DOCKER_USERNAME }}/${{ secrets.PROXY_IMAGE_NAME }} | grep -q . && sudo /usr/local/bin/docker rmi ${{ secrets.DOCKER_USERNAME }}/${{ secrets.PROXY_IMAGE_NAME }}

            sudo /usr/local/bin/docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.PROXY_IMAGE_NAME }}

            sudo /usr/local/bin/docker run -d \
              -e PORT='${{ secrets.PROXY_WEB_PORT }}' \
              -e PINCODE='${{ secrets.PROXY_PINCODE }}' \
              -e CERTIFICATE_FILENAME='${{ secrets.PROXY_CERTIFICATE_FILENAME }}' \
              -e CERTIFICATE_PASSWORD='${{ secrets.PROXY_CERTIFICATE_PASSWORD }}' \
              -e MODBUS_ADDRESS='${{ secrets.PROXY_MODBUS_ADDRESS }}' \
              -e MODBUS_PORT='${{ secrets.PROXY_MODBUS_PORT }}' \
              -e CLIENT_SECRET='${{ secrets.PROXY_CLIENT_SECRET }}' \
              -v '${{ secrets.PROXY_CERTIFICATE_PATH }}':/certificate \
              --name ${{ secrets.PROXY_CONTAINER_NAME }} \
              --restart always \
              --network host \
              ${{ secrets.DOCKER_USERNAME }}/${{ secrets.PROXY_IMAGE_NAME }}
